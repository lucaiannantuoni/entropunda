<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TrueHexClock: the day divided by 16. How to read hexadecimal time on a Garmin watch face.">
<title>TrueHexClock Guide</title>
<style>
/* Layout: one reading column; a dark "watch screen" panel carries the live hex time, everything else is a calm instrument manual around it. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #161B21;
  --muted: #5B6673;
  --rule: #D3D9E0;
  --hour: #178A40;       /* 1st digit: hex hour */
  --min: #D4501A;        /* 2nd-3rd digits: hex minutes */
  --sec: #1A7CB8;        /* 4th digit: hex second */
  --panel: #0A0D10;      /* the watch screen, dark in both themes */
  --panel-ink: #C9D1D9;
  --focus: #1A7CB8;
  --font-display: "Chakra Petch", "Eurostile", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1216; --surface: #151A20; --ink: #E4E9EE; --muted: #97A3AF; --rule: #28313A;
    --hour: #3FD170; --min: #FF7E45; --sec: #45B2F2; --focus: #45B2F2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1216; --surface: #151A20; --ink: #E4E9EE; --muted: #97A3AF; --rule: #28313A;
  --hour: #3FD170; --min: #FF7E45; --sec: #45B2F2; --focus: #45B2F2; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1rem/1.6 var(--font-body);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 56px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.6rem, 8vw, 4rem); letter-spacing: 0.01em; }
h2 { font-size: 1.6rem; }
p { margin: 0; max-width: 65ch; }
section { display: flex; flex-direction: column; gap: 16px; }
.kicker { font: 600 0.78rem/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.h { color: var(--hour); } .m { color: var(--min); } .s { color: var(--sec); }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; padding-block: 20px 0; gap: 12px; }
.brand { font: 600 1rem/1 var(--font-display); letter-spacing: 0.04em; }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.lang button { font: 600 0.8rem/1 var(--font-body); letter-spacing: 0.06em; padding: 8px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; }
.hero-text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lede { font-size: 1.15rem; color: var(--muted); }
.watch {
  width: min(300px, 78vw); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%; background: var(--panel);
  box-shadow: 0 0 0 10px #2A3037, 0 0 0 12px #454D56, 0 18px 40px rgba(0,0,0,0.28);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  margin: 12px;
}
.watch svg { width: 84%; height: auto; display: block; }
.watch .dec { font: 500 1rem/1 var(--font-mono); color: var(--panel-ink); letter-spacing: 0.06em; }
@media (max-width: 620px) { .hero { grid-template-columns: 1fr; justify-items: center; } .hero-text { text-align: left; } }

/* tables */
.table-scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font: 600 0.75rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
td.hex { font: 600 1.05rem/1 var(--font-mono); }
tr.now td { background: color-mix(in srgb, var(--hour) 12%, transparent); }

/* anatomy */
.anatomy { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.part { border-top: 4px solid currentColor; padding-top: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.part .big { font: 700 2rem/1 var(--font-mono); }
.part .name { font-weight: 600; color: var(--ink); }
.part .len { color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) { .anatomy { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; } }

/* dial */
.dial-row { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; }
.dial-row svg { width: 100%; height: auto; display: block; }
.dial-row svg text { font-family: var(--font-mono); }
@media (max-width: 620px) { .dial-row { grid-template-columns: 1fr; } }
.anchors { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: baseline; }
.anchors .hex { font: 700 1.4rem/1 var(--font-mono); color: var(--hour); }

/* letters */
.letters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.letter { background: var(--panel); border-radius: 8px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.letter svg { width: 70%; max-width: 64px; height: auto; }
.letter span { font: 500 0.95rem/1 var(--font-mono); color: var(--panel-ink); }
@media (max-width: 480px) { .letters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* converter */
.converter { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.conv-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.conv-card label { font: 600 0.75rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.conv-card input { font: 500 1.4rem/1.2 var(--font-mono); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; }
.conv-card .out { font: 700 1.8rem/1.2 var(--font-mono); overflow-wrap: anywhere; }
.conv-card .note { font-size: 0.88rem; color: var(--muted); min-height: 1.4em; }
@media (max-width: 560px) { .converter { grid-template-columns: 1fr; } }

/* maths + binary */
.formula { font: 500 0.98rem/1.7 var(--font-mono); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.bits { display: flex; flex-wrap: wrap; gap: 14px; }
.nibble { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.nibble .cells { display: flex; gap: 4px; }
.nibble .cell { width: 20px; height: 20px; border-radius: 3px; border: 2px solid var(--rule); }
.nibble .cell.on { border-color: currentColor; background: currentColor; }
.nibble .d { font: 700 1.1rem/1 var(--font-mono); }

footer { border-top: 1px solid var(--rule); padding-top: 18px; color: var(--muted); font-size: 0.9rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <span class="brand">TrueHexClock</span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-it" data-lang="it" aria-pressed="false">IT</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <header class="hero">
    <div class="hero-text">
      <span class="kicker" data-i18n="kicker"></span>
      <h1>TrueHexClock</h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <div class="watch" aria-live="off">
      <svg id="live" viewBox="0 0 300 100" role="img" aria-label="hex time"></svg>
      <div class="dec" id="live-dec">--:--:--</div>
    </div>
  </header>

  <section>
    <h2 data-i18n="ideaTitle"></h2>
    <p data-i18n="ideaText"></p>
    <div class="table-scroll"><table id="units"></table></div>
  </section>

  <section>
    <h2 data-i18n="anatomyTitle"></h2>
    <p data-i18n="anatomyText"></p>
    <div class="anatomy" id="anatomy"></div>
  </section>

  <section>
    <h2 data-i18n="dialTitle"></h2>
    <div class="dial-row">
      <svg id="dial" viewBox="0 0 340 340" role="img" aria-label="16 hex hours"></svg>
      <div class="anchors" id="anchors"></div>
    </div>
    <div class="table-scroll"><table id="hours"></table></div>
  </section>

  <section>
    <h2 data-i18n="secondTitle"></h2>
    <p data-i18n="secondText"></p>
    <div class="table-scroll"><table id="second"></table></div>
  </section>

  <section>
    <h2 data-i18n="lettersTitle"></h2>
    <p data-i18n="lettersText"></p>
    <div class="letters" id="letters"></div>
  </section>

  <section>
    <h2 data-i18n="convTitle"></h2>
    <div class="converter">
      <div class="conv-card">
        <label for="in-time" data-i18n="convFromTime"></label>
        <input id="in-time" type="time" step="1" value="12:40:00">
        <div class="out" id="out-hex">8_71_C</div>
        <div class="note" id="note-hex"></div>
      </div>
      <div class="conv-card">
        <label for="in-hex" data-i18n="convFromHex"></label>
        <input id="in-hex" type="text" value="A_3F" autocomplete="off" spellcheck="false" inputmode="text">
        <div class="out" id="out-time">15:22:09</div>
        <div class="note" id="note-time"></div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="examplesTitle"></h2>
    <div class="table-scroll"><table id="examples"></table></div>
  </section>

  <section>
    <h2 data-i18n="mathTitle"></h2>
    <div class="formula" id="formula"></div>
    <p data-i18n="realHex"></p>
  </section>

  <section>
    <h2 data-i18n="binaryTitle"></h2>
    <p data-i18n="binaryText"></p>
    <div class="bits" id="bits"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

<script>
(() => {
  // ---- hexadecimal time --------------------------------------------------
  const DAY = 86400;
  const toHex16 = secs => Math.floor(secs * 65536 / DAY) & 0xFFFF;
  const digitsOf = v => [v >> 12, (v >> 8) & 15, (v >> 4) & 15, v & 15];
  const H = n => n.toString(16).toUpperCase();
  // display glyphs: b and d in lowercase as on seven-segment displays
  const GLYPH = "0123456789AbCdEF";
  const fmtHex = (d, secs) => GLYPH[d[0]] + "_" + GLYPH[d[1]] + GLYPH[d[2]] + (secs ? "_" + GLYPH[d[3]] : "");
  const pad = n => String(n).padStart(2, "0");
  const hms = s => { s = Math.round(s) % DAY; return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60); };

  // ---- seven segments, same geometry as the watch face -------------------
  const MASKS = [0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F, 0x77, 0x7C, 0x39, 0x5E, 0x79, 0x71];
  const SLANT = 0.1;
  function glyph(mask, x, y, h, w, color, ghost) {
    const t = h * 0.13, g = Math.max(1, t / 4), hf = t / 2;
    const xl = x + hf, xr = x + w - hf, yt = y + hf, ym = y + h / 2, yb = y + h - hf;
    const ends = [[xl, yt, xr, yt], [xr, yt, xr, ym], [xr, ym, xr, yb], [xl, yb, xr, yb], [xl, ym, xl, yb], [xl, yt, xl, ym], [xl, ym, xr, ym]];
    let out = "";
    ends.forEach(([x1, y1, x2, y2], s) => {
      const lit = (mask >> s) & 1;
      if (!lit && !ghost) return;
      let pts;
      if (y1 === y2) { const a = x1 + g, b = x2 - g; pts = [[a, y1], [a + hf, y1 - hf], [b - hf, y1 - hf], [b, y1], [b - hf, y1 + hf], [a + hf, y1 + hf]]; }
      else { const a = y1 + g, b = y2 - g; pts = [[x1, a], [x1 + hf, a + hf], [x1 + hf, b - hf], [x1, b], [x1 - hf, b - hf], [x1 - hf, a + hf]]; }
      const p = pts.map(([px, py]) => (px + (y + h - py) * SLANT).toFixed(2) + "," + py.toFixed(2)).join(" ");
      out += `<polygon points="${p}" fill="${lit ? color : ghost}"/>`;
    });
    return out;
  }
  // watch colors (classic palette) and their dark "ghost" segments
  const WATCH = { h: "#00FF00", m: "#FF5500", s: "#00AAFF", sep: "#AAAAAA", gh: "#0B330B", gm: "#3A1400", gs: "#002B40" };
  function displaySVG(d, h) {
    const w = h * 0.52, sp = h * 0.12, sw = h * 0.42, sl = h * SLANT;
    let x = 0, svg = "";
    const put = (mask, width, color, ghost) => { svg += glyph(mask, x, 0, h, width, color, ghost); x += width + sl + sp; };
    put(MASKS[d[0]], w, WATCH.h, WATCH.gh);
    put(0x08, sw, WATCH.sep, null);
    put(MASKS[d[1]], w, WATCH.m, WATCH.gm);
    put(MASKS[d[2]], w, WATCH.m, WATCH.gm);
    put(0x08, sw, WATCH.sep, null);
    put(MASKS[d[3]], w, WATCH.s, WATCH.gs);
    return { svg, width: x - sp };
  }

  // ---- texts ---------------------------------------------------------------
  const T = {
    it: {
      kicker: "Quadrante per orologi Garmin",
      lede: "Il giorno diviso per 16, poi ancora per 16. Ecco come si legge l’ora esadecimale.",
      ideaTitle: "L’idea",
      ideaText: "Invece di 24 ore da 60 minuti da 60 secondi, il tempo esadecimale divide il giorno <strong>sempre per 16</strong>. Ogni cifra vale 16 volte meno della precedente, proprio come le posizioni di un numero in base 16.",
      unitsHead: ["Cifra", "Unità", "In un giorno", "Durata"],
      units: [["1ª", "ora esadecimale", "16", "1 h 30 min"], ["2ª", "sedicesimo di ora", "256", "5 min 37,5 s"], ["3ª", "minuto esadecimale", "4096", "circa 21 s"], ["4ª", "secondo esadecimale (opzione)", "65536", "circa 1,3 s"]],
      anatomyTitle: "Come si legge il display",
      anatomyText: "L’orologio mostra <code>A_3F</code>, oppure <code>A_3F_C</code> con i secondi. Il trattino basso separa le parti, come i due punti in 15:22. I colori sono quelli della palette classica.",
      parts: [["ora esadecimale", "1 h 30"], ["sedicesimi", "5 min 37,5 s"], ["minuti esadecimali", "circa 21 s"], ["secondi esadecimali", "circa 1,3 s"]],
      dialTitle: "Le 16 ore del giorno",
      anchors: [["0", "mezzanotte"], ["4", "le 6 del mattino"], ["8", "mezzogiorno"], ["C", "le 18"]],
      anchorsIntro: "Bastano quattro punti fissi:",
      hoursHead: ["Hex", "Dalle", "Alle"],
      secondTitle: "La seconda cifra",
      secondText: "Dice quanto è passato dell’ora esadecimale. Ogni passo vale 5 min 37,5 s, circa cinque minuti e mezzo; <strong>8 è a metà</strong>, cioè 45 minuti.",
      secondHead: ["Hex", "Dopo", "Hex", "Dopo"],
      lettersTitle: "Dopo il 9 vengono le lettere",
      lettersText: "Le cifre vanno da 0 a F. <strong>b</strong> e <strong>d</strong> sono minuscole, come su tutti i display a 7 segmenti, per non confonderle con 8 e 0.",
      convTitle: "Convertitore",
      convFromTime: "Ora normale",
      convFromHex: "Ora esadecimale (es. A_3F o A_3F_C)",
      convBadHex: "Scrivi da 1 a 4 cifre esadecimali (0-9, A-F), con o senza trattini.",
      convNoteHex: "Con i secondi. Senza: ",
      convNoteTime: "Inizio di quel valore: ogni ora esadecimale ha 256 minuti esadecimali.",
      examplesTitle: "Esempi",
      examplesHead: ["TrueHexClock", "Ora normale", "Come si legge"],
      examples: [["8_00", "12:00", "mezzogiorno in punto"], ["C_00", "18:00", "C = le 18"], ["A_3F", "15:22", "A = 15:00, 3 = +16:52, F = +5:16"], ["8_71", "12:40", "8 = 12:00, 7 = +39:22, 1 = +21 s"], ["0_02", "00:01", "appena dopo mezzanotte"], ["F_Fd", "23:59", "quasi fine giornata"]],
      mathTitle: "I conti, se ti servono",
      formula: "Da TrueHexClock all’ora normale:\n  1ª cifra × 1 h 30 + 2ª × 5 min 37,5 s + 3ª × 21,1 s + 4ª × 1,32 s\n\nDall’ora normale a TrueHexClock:\n  secondi dalla mezzanotte × 65536 ÷ 86400, scritto in base 16\n  esempio: 12:40 = 45600 s → 34588 → 871C → 8_71_C\n\nScorciatoia per la prima cifra:\n  ore ÷ 1,5, arrotondato per difetto (le 16 → 10,6 → A)",
      realHex: "È esadecimale vero: <code>A_3F_C</code> è la frazione del giorno scritta in base 16, cioè 0,A3FC₁₆ di giornata (circa il 64%). Non va confuso con scrivere in esadecimale le ore normali (15:22 → F:16): lì resterebbe un orologio a 24 e 60.",
      binaryTitle: "Il legame con il binario",
      binaryText: "Ogni cifra esadecimale corrisponde a 4 bit. L’ora di adesso in bit, una riga per cifra, come nel quadrante TrueBinaryClock:",
      footer: "TrueHexClock è un quadrante Connect IQ per orologi Garmin. Senza secondi si aggiorna una volta al minuto, quindi l’ultima cifra salta di 2-3 passi alla volta; con i secondi, la quarta cifra si spegne in standby."
    },
    en: {
      kicker: "Watch face for Garmin watches",
      lede: "The day divided by 16, then by 16 again. Here is how to read hexadecimal time.",
      ideaTitle: "The idea",
      ideaText: "Instead of 24 hours of 60 minutes of 60 seconds, hexadecimal time divides the day <strong>by 16 every time</strong>. Each digit is worth 16 times less than the one before, exactly like the places of a base-16 number.",
      unitsHead: ["Digit", "Unit", "Per day", "Length"],
      units: [["1st", "hex hour", "16", "1 h 30 min"], ["2nd", "sixteenth of an hour", "256", "5 min 37.5 s"], ["3rd", "hex minute", "4096", "about 21 s"], ["4th", "hex second (optional)", "65536", "about 1.3 s"]],
      anatomyTitle: "Reading the display",
      anatomyText: "The watch shows <code>A_3F</code>, or <code>A_3F_C</code> with seconds. The underscore separates the parts, like the colon in 15:22. Colors are those of the classic palette.",
      parts: [["hex hour", "1 h 30"], ["sixteenths", "5 min 37.5 s"], ["hex minutes", "about 21 s"], ["hex seconds", "about 1.3 s"]],
      dialTitle: "The 16 hours of the day",
      anchors: [["0", "midnight"], ["4", "6 am"], ["8", "noon"], ["C", "6 pm"]],
      anchorsIntro: "Four anchors are enough:",
      hoursHead: ["Hex", "From", "To"],
      secondTitle: "The second digit",
      secondText: "It tells how far into the hex hour you are. Each step is 5 min 37.5 s, about five and a half minutes; <strong>8 is halfway</strong>, 45 minutes.",
      secondHead: ["Hex", "After", "Hex", "After"],
      lettersTitle: "After 9 come letters",
      lettersText: "Digits go from 0 to F. <strong>b</strong> and <strong>d</strong> are lowercase, as on every seven-segment display, so they don’t look like 8 and 0.",
      convTitle: "Converter",
      convFromTime: "Normal time",
      convFromHex: "Hex time (e.g. A_3F or A_3F_C)",
      convBadHex: "Type 1 to 4 hex digits (0-9, A-F), with or without underscores.",
      convNoteHex: "With seconds. Without: ",
      convNoteTime: "Start of that value: each hex hour has 256 hex minutes.",
      examplesTitle: "Examples",
      examplesHead: ["TrueHexClock", "Normal time", "How to read it"],
      examples: [["8_00", "12:00", "noon sharp"], ["C_00", "18:00", "C = 6 pm"], ["A_3F", "15:22", "A = 15:00, 3 = +16:52, F = +5:16"], ["8_71", "12:40", "8 = 12:00, 7 = +39:22, 1 = +21 s"], ["0_02", "00:01", "just after midnight"], ["F_Fd", "23:59", "almost the end of the day"]],
      mathTitle: "The maths, if you need it",
      formula: "TrueHexClock → normal time:\n  1st digit × 1 h 30 + 2nd × 5 min 37.5 s + 3rd × 21.1 s + 4th × 1.32 s\n\nNormal time → TrueHexClock:\n  seconds since midnight × 65536 ÷ 86400, written in base 16\n  example: 12:40 = 45600 s → 34588 → 871C → 8_71_C\n\nFirst digit shortcut:\n  hours ÷ 1.5, rounded down (16:00 → 10.6 → A)",
      realHex: "It is true hexadecimal: <code>A_3F_C</code> is the fraction of the day written in base 16, 0.A3FC₁₆ of a day (about 64%). It is not the same as writing ordinary hours in hex (15:22 → F:16), which would still be a clock based on 24 and 60.",
      binaryTitle: "The binary connection",
      binaryText: "Each hex digit is 4 bits. The current time in bits, one row per digit, as on the TrueBinaryClock face:",
      footer: "TrueHexClock is a Connect IQ watch face for Garmin watches. Without seconds it updates once a minute, so the last digit jumps 2–3 steps at a time; with seconds, the fourth digit turns off in standby."
    }
  };

  let lang = "en";
  try { lang = localStorage.getItem("hexclock-lang") || ""; } catch (e) { lang = ""; }
  if (location.hash === "#it" || location.hash === "#en") lang = location.hash.slice(1);
  if (lang !== "it" && lang !== "en") lang = (navigator.language || "").toLowerCase().startsWith("it") ? "it" : "en";

  const $ = id => document.getElementById(id);
  const table = (head, rows, rowClass) => "<thead><tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map((r, i) => `<tr class="${rowClass ? rowClass(i) : ""}">` + r.map((c, j) => `<td class="${j === 0 ? "hex" : ""}">${c}</td>`).join("") + "</tr>").join("") + "</tbody>";

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
    $("lang-it").setAttribute("aria-pressed", lang === "it");
    $("lang-en").setAttribute("aria-pressed", lang === "en");

    $("units").innerHTML = table(t.unitsHead, t.units);
    const cls = ["h", "m", "m", "s"], sample = ["A", "3", "F", "C"];
    $("anatomy").innerHTML = t.parts.map((p, i) => `<div class="part ${cls[i]}"><span class="big">${sample[i]}</span><span class="name">${p[0]}</span><span class="len">${p[1]}</span></div>`).join("");
    $("anchors").innerHTML = `<span></span><span class="muted">${t.anchorsIntro}</span>` + t.anchors.map(a => `<span class="hex">${a[0]}</span><span>${a[1]}</span>`).join("");
    renderHours();
    const rows = [];
    for (let i = 0; i < 8; i++) {
      const cell = k => { const s = k * 337.5; return (s >= 3600 ? "1:" + pad(Math.floor((s - 3600) / 60)) : Math.floor(s / 60)) + ":" + pad(Math.floor(s % 60)); };
      rows.push([GLYPH[i], cell(i), `<strong class="mono">${GLYPH[i + 8]}</strong>`, cell(i + 8)]);
    }
    $("second").innerHTML = table(t.secondHead, rows);
    $("examples").innerHTML = table(t.examplesHead, t.examples);
    $("formula").textContent = t.formula;
    convertTime(); convertHex();
  }

  function renderHours() {
    const t = T[lang], now = currentHourDigit();
    const rows = [];
    for (let i = 0; i < 16; i++) rows.push([GLYPH[i], hms(i * 5400).slice(0, 5), hms((i + 1) * 5400).slice(0, 5).replace("00:00", "24:00")]);
    $("hours").innerHTML = table(t.hoursHead, rows, i => i === now ? "now" : "");
  }

  // ---- dial: 16 sectors, midnight at the top --------------------------------
  function renderDial() {
    const now = currentHourDigit(), cx = 170, cy = 170, r1 = 150, r0 = 92;
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue("--ink").trim(), muted = css.getPropertyValue("--muted").trim(),
          rule = css.getPropertyValue("--rule").trim(), hour = css.getPropertyValue("--hour").trim(), surface = css.getPropertyValue("--surface").trim();
    const pt = (a, r) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    let svg = "";
    for (let i = 0; i < 16; i++) {
      const a0 = i * Math.PI / 8, a1 = (i + 1) * Math.PI / 8;
      const [x0, y0] = pt(a0, r1), [x1, y1] = pt(a1, r1), [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0);
      const fill = i === now ? hour : surface;
      svg += `<path d="M${x0},${y0} A${r1},${r1} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z" fill="${fill}" stroke="${rule}" stroke-width="1.5"/>`;
      const [lx, ly] = pt((a0 + a1) / 2, (r1 + r0) / 2);
      svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="${i === now ? surface : ink}">${GLYPH[i]}</text>`;
    }
    // hour labels on the inner ring every 3 hex hours (4.5 h would not be round: use the anchors)
    [[0, "00:00"], [4, "06:00"], [8, "12:00"], [12, "18:00"]].forEach(([i, lbl]) => {
      const [tx, ty] = pt(i * Math.PI / 8, r0 - 18);
      svg += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="${muted}">${lbl}</text>`;
    });
    // current time hand
    const secs = secondsNow(), a = secs / DAY * 2 * Math.PI;
    const [hx, hy] = pt(a, r1 + 4);
    svg += `<line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="${ink}"/>`;
    $("dial").innerHTML = svg;
  }

  // ---- live clock -------------------------------------------------------------
  const secondsNow = () => { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); };
  const currentHourDigit = () => toHex16(secondsNow()) >> 12;
  let lastHour = -1, lastMinute = -1;
  function tick() {
    const secs = secondsNow(), d = digitsOf(toHex16(secs));
    const { svg, width } = displaySVG(d, 100);
    const live = $("live");
    live.setAttribute("viewBox", `-4 -4 ${width + 8} 108`);
    live.innerHTML = svg;
    live.setAttribute("aria-label", fmtHex(d, true));
    $("live-dec").textContent = hms(secs);
    if (d[0] !== lastHour) { lastHour = d[0]; renderHours(); }
    const minute = Math.floor(secs / 60);
    if (minute !== lastMinute) { lastMinute = minute; renderDial(); renderBits(d); }
  }

  function renderBits(d) {
    const cls = ["h", "m", "m", "s"];
    $("bits").innerHTML = d.map((v, i) => {
      const cells = [3, 2, 1, 0].map(b => `<span class="cell ${(v >> b) & 1 ? "on" : ""}"></span>`).join("");
      return `<div class="nibble ${cls[i]}"><span class="cells">${cells}</span><span class="d">${GLYPH[v]}</span></div>`;
    }).join("");
  }

  function renderLetters() {
    $("letters").innerHTML = [10, 11, 12, 13, 14, 15].map(v =>
      `<div class="letter"><svg viewBox="-2 -2 66 104" aria-hidden="true">${glyph(MASKS[v], 2, 0, 100, 52, WATCH.m, WATCH.gm)}</svg><span>${GLYPH[v]} = ${v}</span></div>`).join("");
  }

  // ---- converter -----------------------------------------------------------------
  function convertTime() {
    const v = $("in-time").value;
    const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(v);
    if (!m) { $("out-hex").textContent = "–"; $("note-hex").textContent = ""; return; }
    const secs = (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0));
    const d = digitsOf(toHex16(secs));
    $("out-hex").innerHTML = `<span class="h">${GLYPH[d[0]]}</span>_<span class="m">${GLYPH[d[1]]}${GLYPH[d[2]]}</span>_<span class="s">${GLYPH[d[3]]}</span>`;
    $("note-hex").textContent = T[lang].convNoteHex + fmtHex(d, false);
  }
  function convertHex() {
    const raw = $("in-hex").value.replace(/[_\s:.]/g, "").toUpperCase();
    if (!/^[0-9A-F]{1,4}$/.test(raw)) { $("out-time").textContent = "–"; $("note-time").textContent = T[lang].convBadHex; return; }
    const v = parseInt(raw.padEnd(4, "0"), 16);
    $("out-time").textContent = hms(v * DAY / 65536);
    $("note-time").textContent = T[lang].convNoteTime;
  }

  // ---- wiring ----------------------------------------------------------------------
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("hexclock-lang", lang); } catch (e) {}
    render(); renderDial();
  }));
  $("in-time").addEventListener("input", convertTime);
  $("in-hex").addEventListener("input", convertHex);
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", renderDial);
  new MutationObserver(renderDial).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  renderLetters();
  render();
  tick();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
